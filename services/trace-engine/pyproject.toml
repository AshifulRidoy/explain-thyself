[project]
name = "trace-engine"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "nanoid>=2.0.0",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "torch>=2.13.0",
    "transformer-lens>=3.7.2",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "db: requires postgres running (docker compose up -d && pnpm db:migrate)",
]
